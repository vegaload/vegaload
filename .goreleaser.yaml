version: 2

project_name: vegaload

builds:
  - id: vegaload
    main: ./cmd/vegaload
    binary: vegaload
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: vegaload
    ids:
      - vegaload
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: vegaload
    name: vegaload

# Homebrew formula, pushed to the vegaload/homebrew-tap repo on each tagged
# release. Needs the HOMEBREW_TAP_TOKEN secret (see RELEASING.md).
brews:
  - name: vegaload
    ids:
      - vegaload
    repository:
      owner: vegaload
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/vegaload/vegaload
    description: "Open-source load testing for code and AI agents. One static binary."
    license: Apache-2.0
    commit_author:
      name: vegaload-bot
      email: bot@vegaload.dev
    commit_msg_template: "vegaload {{ .Tag }}"
    test: |
      assert_match "vegaload #{version}", shell_output("#{bin}/vegaload version")
